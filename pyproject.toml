[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hylogger-data-bridge"
version = "0.1.0"
description = "Local next-action learning prototype for HyLogger investigations"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
hylogger-policy = "hylogger_bridge.cli:main"

[dependency-groups]
train = ["scikit-learn==1.7.2"]
dev = ["pytest==8.4.2", "ruff==0.14.1", "mypy==1.18.2"]

[tool.uv]
default-groups = ["dev", "train"]

[tool.hatch.build.targets.wheel]
packages = ["src/hylogger_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v1.json" = "hylogger_bridge/contracts/v1.json"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
